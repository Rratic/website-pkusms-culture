<p><strong>目标：</strong>只从 A、B 两点作出线段 AB 的中点 M。先用等边圆链得到延长点，再用反演把两倍距离缩回一半。</p>
<ol>
  <li>作 A(B) 与 B(A)，取得两个交点 C、D。</li>
  <li>作 C(D) 与 D(C)，取得两个交点 E、F；取位于 B 外侧的 F。此时 AF = 2AB。</li>
  <li>作 F(A)，它与 A(B) 交于 U、V。</li>
  <li>作 U(A) 与 V(A)，取得除 A 外的另一个交点 M。</li>
</ol>
<p>最后一步给出的 M 是 F 关于圆 A(B) 的反演像，因此 AM · AF = AB²。由 AF = 2AB 可得 AM = AB/2，并且 M 位于 AB 上。</p>

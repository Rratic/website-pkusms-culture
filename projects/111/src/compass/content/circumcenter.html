<p><strong>目标：</strong>只从三个非共线点 A、B、C 恢复它们的外接圆心 O。下面的每一步都必须在本画布中实际完成。</p>
<ol>
  <li>关于圆 A(B) 反演 C：作 A(B)、C(A)，取得 U、V；作 U(A)、V(A)，取得除 A 外的点 D。</li>
  <li>把 A 关于由 B、D 确定的直线反射：作 B(A)、D(A)，取得除 A 外的点 X。</li>
  <li>关于圆 A(B) 反演 X：作 X(A)，它与 A(B) 交于 G、H；作 G(A)、H(A)，取得除 A 外的点 O。</li>
</ol>
<p>最终得到的 O 与 A、B、C 等距，因此是三点所定圆的圆心。</p>
